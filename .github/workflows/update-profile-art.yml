name: Update profile art
"on":
  schedule:
    - cron: "17 6 * * *"      # daily, ~06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/make_heatmap.py", ".github/workflows/update-profile-art.yml"]

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Render heatmap from real contributions
        run: python scripts/make_heatmap.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # swap for a PAT secret (read:user) to include private contributions
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg
          git diff --staged --quiet || (git commit -m "chore: refresh contribution graph [skip ci]" && git push)
