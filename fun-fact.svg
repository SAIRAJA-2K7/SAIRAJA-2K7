<svg xmlns="http://www.w3.org/2000/svg" width="840" height="310" viewBox="0 0 840 310" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<style>
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
.t{animation:in .6s ease-out both}
.p{animation:pulse 2s ease-in-out infinite}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#111722"/><stop offset="1" stop-color="#0d1117"/>
</linearGradient></defs>
<rect width="840" height="310" rx="12" fill="url(#bg)"/>
<rect x=".5" y=".5" width="839" height="309" rx="12" fill="none" stroke="#30363d"/>
<line x1="0" y1="30" x2="840" y2="30" stroke="#30363d"/>
<circle cx="20" cy="15" r="5" fill="#ff5f56"/><circle cx="36" cy="15" r="5" fill="#ffbd2e"/><circle cx="52" cy="15" r="5" fill="#27c93f"/>
<text x="420" y="19" text-anchor="middle" fill="#7d8590" font-size="12">sairaja@github: ~$ ./fun-fact.sh</text>
<g class="t">
<text x="28" y="68" fill="#e6edf3" font-size="21" font-weight="700">$ ./fun-fact</text>
<rect x="24" y="95" width="792" height="170" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="48" y="145" fill="#39d353" font-size="18">⚡ fun fact</text>
<text x="48" y="185" fill="#e6edf3" font-size="18">I optimize animations nobody asked for...</text>
<text x="48" y="220" fill="#7d8590" font-size="16">and then optimize them again. 😎</text>
<text x="48" y="252" fill="#7d8590" font-size="12">status: unnecessarily polished</text>
</g>
</svg>